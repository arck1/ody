services:
  postgres:
    image: postgres:16-alpine
    container_name: schedulor-postgres
    environment:
      POSTGRES_DB: schedulor
      POSTGRES_USER: schedulor
      POSTGRES_PASSWORD: schedulor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulor -d schedulor"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
