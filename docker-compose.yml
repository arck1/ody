services:
  postgres:
    image: postgres:16-alpine
    container_name: schedulor-postgres
    environment:
      POSTGRES_DB: schedulor
      POSTGRES_USER: schedulor
      POSTGRES_PASSWORD: schedulor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedulor -d schedulor"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: schedulor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
